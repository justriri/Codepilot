<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePilot Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>CodePilot Test</h1>
    <p id="status">Waiting...</p>
    <button id="verifyBtn" onclick="verify()">Click Me</button>
</div>

<script>
function verify() {
    document.getElementById("status").textContent = "Success!";
}
</script>

</body>
</html>
